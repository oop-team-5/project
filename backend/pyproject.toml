[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seoul-cycle"
version = "0.1.0"
description = "Seoul Cycle 팀 프로젝트의 계약 중심 스캐폴딩"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["mypy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seoul_cycle = ["py.typed"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
